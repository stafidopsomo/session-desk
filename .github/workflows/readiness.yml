name: Product readiness checks

on:
  push:
    branches: [release-dev]
  pull_request:
    branches: [release-dev]

permissions:
  contents: read

jobs:
  readiness:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch only the tested history for the root check
        shell: pwsh
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          $taskAuth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_READ_TOKEN"))
          Write-Output "::add-mask::$taskAuth"
          git -c "http.extraheader=AUTHORIZATION: basic $taskAuth" fetch --no-tags --unshallow origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check independent history and readiness file boundary
        run: python tools/check_product_boundary.py
      - name: Test diagnostics with synthetic messages only
        run: python -m unittest discover -s tests -v

# Deliberately no live probe, provider login, build, artifacts or release job.
